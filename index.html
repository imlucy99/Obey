<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="hud">

    <!-- ===== GAUGE (SVG) : rumah, tick, angka, jarum ===== -->
    <svg class="gauge" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="housingGrad" cx="200" cy="200" r="200" gradientUnits="userSpaceOnUse">
          <stop offset="0"   stop-color="#171a1f"/>
          <stop offset="0.7" stop-color="#0c0e11"/>
          <stop offset="1"   stop-color="#040405"/>
        </radialGradient>
        <linearGradient id="rimGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0"   stop-color="#ff6a00"/>
          <stop offset="0.5" stop-color="#ff9a1f"/>
          <stop offset="1"   stop-color="#ff6a00"/>
        </linearGradient>
        <linearGradient id="needleGrad" x1="-20" y1="0" x2="168" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0"   stop-color="#b53c00"/>
          <stop offset="0.6" stop-color="#ff6a00"/>
          <stop offset="1"   stop-color="#ffb347"/>
        </linearGradient>
        <radialGradient id="hubGrad" cx="0.4" cy="0.35" r="0.8">
          <stop offset="0" stop-color="#555a62"/>
          <stop offset="1" stop-color="#101113"/>
        </radialGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3.2"/>
        </filter>
      </defs>

      <!-- Rumah / bezel -->
      <path d="M5,200 A195,195 0 0 1 395,200 L395,305 Q395,331 369,331 L31,331 Q5,331 5,305 Z"
            fill="url(#housingGrad)" stroke="#262a30" stroke-width="2"/>

      <!-- Garis oranye di tepi (diisi via JS) -->
      <g id="rim"></g>

      <!-- Cincin RPM putus-putus (diisi via JS) -->
      <g id="rpm" class="rpm-ring"></g>

      <!-- Tick & angka (diisi via JS) -->
      <g id="ticks"></g>
      <g id="labels"></g>

      <!-- Jarum -->
      <g transform="translate(200,200)">
        <g id="needle" class="needle">
          <polygon points="-22,-2.6 0,-4.2 170,-0.9 170,0.9 0,4.2 -22,2.6"
                   fill="#ff6a00" filter="url(#glow)" opacity="0.85"/>
          <polygon points="-22,-2.6 0,-4.2 170,-0.9 170,0.9 0,4.2 -22,2.6"
                   fill="url(#needleGrad)"/>
        </g>
        <circle r="15" fill="url(#hubGrad)" stroke="#6a6f78" stroke-width="1.5"/>
        <circle r="6.5" fill="#1b1c1f" stroke="#2f3237" stroke-width="1"/>
      </g>
    </svg>

    <!-- ===== Kecepatan digital + sein ===== -->
    <div class="speed-block">
      <div class="speed-row">
        <div id="indicator-left" class="icon-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>

        <div id="speed-display" class="speed-text"></div>

        <div id="indicator-right" class="icon-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </div>
      </div>
      <div id="speed-mode" class="speed-unit">MPH</div>
      <div class="rpm-label">x1000 r/min</div>
    </div>

    <!-- ===== Panel info: Gear, Odo, Fuel, Engine ===== -->
    <div class="info-panel">
      <div class="info-top">
        <div class="info-group">
          <span class="info-label">GEAR</span>
          <span id="gear" class="gear-main">1</span>
        </div>
        <div class="info-group">
          <span class="info-label">ODO</span>
          <span id="odometer" class="odometer">0.0<small> mi</small></span>
        </div>
      </div>

      <div class="info-bottom">
        <!-- Fuel -->
        <div class="stat-container">
          <div class="stat-icon on">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 11h-1V3c0-.55-.45-1-1-1H7c-.55 0-1 .45-1 1v18h12c.55 0 1-.45 1-1v-6c0-1.66-1.34-3-3-3zm-3 2c.55 0 1 .45 1 1v4h-2v-5h1zM8 4h8v5H8V4z"/>
            </svg>
          </div>
          <span class="stat-label">E</span>
          <div id="fuel-segments" class="stat-segments">
            <div class="f-seg"></div><div class="f-seg"></div>
            <div class="f-seg"></div><div class="f-seg"></div>
            <div class="f-seg"></div><div class="f-seg"></div>
            <div class="f-seg"></div><div class="f-seg"></div>
            <div class="f-seg"></div><div class="f-seg"></div>
          </div>
          <span class="stat-label">F</span>
        </div>

        <!-- Engine Health -->
        <div class="stat-container">
          <div id="engine-icon" class="stat-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22 12c0-.6-.4-1-1-1h-2V9c0-.6-.4-1-1-1h-2V5c0-.6-.4-1-1-1H9c-.6 0-1 .4-1 1v3H6c-.6 0-1 .4-1 1v2H3c-.6 0-1 .4-1 1v3c0 .6.4 1 1 1h2v2c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-2h2c.6 0 1-.4 1-1v-3zM10 6h4v2h-4V6z"/>
            </svg>
          </div>
          <div id="health-segments" class="stat-segments">
            <div class="h-seg"></div><div class="h-seg"></div>
            <div class="h-seg"></div><div class="h-seg"></div>
            <div class="h-seg"></div><div class="h-seg"></div>
            <div class="h-seg"></div><div class="h-seg"></div>
            <div class="h-seg"></div><div class="h-seg"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Indikator bawah ===== -->
    <div id="indicators" class="bottom-indicators">
      <div id="headlight-low" class="icon-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/>
          <line x1="3" y1="9" x2="7" y2="10"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="3" y1="15" x2="7" y2="14"/>
        </svg>
      </div>
      <div id="headlight-high" class="icon-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/>
          <line x1="2" y1="8" x2="7" y2="8"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="2" y1="16" x2="7" y2="16"/>
        </svg>
      </div>
      <div id="seatbelts" class="icon-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 2v2h10V2H7zm10 18v2H7v-2h10zM10 6h4v3h-4V6zm0 9h4v3h-4v-3zm1-4.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5z"/>
        </svg>
      </div>
      <div id="door-lock" class="icon-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>
    </div>

    <!-- ===== Intro animasi OBEY (slam) ===== -->
    <div class="intro" aria-hidden="true">
      <div class="intro-word">
        <span style="--i:0">O</span><span style="--i:1">B</span><span style="--i:2">E</span><span style="--i:3">Y</span>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
